spring.application.name=nnomm-claim-service

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/nnomm}
spring.datasource.username=${DATABASE_USER:nnomm}
spring.datasource.password=${DATABASE_PASSWORD:nnomm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true

spring.jackson.time-zone=UTC

spring.servlet.multipart.max-request-size=16KB
spring.servlet.multipart.max-file-size=16KB

server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=16KB
